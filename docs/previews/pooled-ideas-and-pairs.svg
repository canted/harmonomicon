<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1234" viewBox="0 0 600 1234" aria-label="Pooled ideas followed by pair discussion runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow-0" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#418cdc"/></marker><marker id="arrow-1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#dfc455"/></marker><marker id="arrow-2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#7dc062"/></marker><marker id="arrow-3" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#eef3fb"/></marker><marker id="arrow-4" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#df5583"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Pooled ideas followed by pair discussion</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.19</text><g data-step="slips" tabindex="0" role="button" aria-label="slips pool@1"><title>/runbook/steps/0</title><rect x="40" y="114" width="368" height="144" rx="8" fill="#418cdc"/><text x="60" y="143" font-weight="700" font-size="18">Slips</text><text x="388" y="143" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">pool@1</text><text x="60" y="166" font-size="14">“Contribute one idea.”</text><text x="60" y="187" font-size="14">Items per participant: 1</text><text x="60" y="208" font-size="14">Closes: all eligible submissions OR 1 min</text><text x="60" y="229" font-size="14">passes</text></g><g data-step="read_slips" tabindex="0" role="button" aria-label="read_slips for_items@1"><title>/runbook/steps/1</title><rect x="20" y="306" width="408" height="545" rx="8" fill="#eef3fb"/><text x="40" y="335" font-weight="700" font-size="18">Read Slips</text><text x="408" y="335" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">for_items@1</text><text x="40" y="358" font-size="14">Repeat for each item from slips</text></g><g data-step="claim" tabindex="0" role="button" aria-label="claim assign_item@1"><title>/runbook/steps/1/steps/0</title><rect x="56" y="387" width="336" height="123" rx="8" fill="#dfc455"/><text x="76" y="416" font-weight="700" font-size="18">Claim</text><text x="372" y="416" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">assign_item@1</text><text x="76" y="439" font-size="14">“Claim this slip if it is not yours.”</text><text x="76" y="460" font-size="14">Policy: policy:claim_reader@1</text><text x="76" y="481" font-size="14">Closes: 30 sec passes</text></g><g data-step="read" tabindex="0" role="button" aria-label="read acknowledge@1"><title>/runbook/steps/1/steps/1</title><rect x="40" y="558" width="368" height="144" rx="8" fill="#7dc062"/><text x="60" y="587" font-weight="700" font-size="18">Read</text><text x="388" y="587" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">acknowledge@1</text><text x="60" y="610" font-size="14">“Read the slip, then acknowledge to share</text><text x="60" y="631" font-size="14">its text.”</text><text x="60" y="652" font-size="14">Source: claim</text><text x="60" y="673" font-size="14">Closes: 30 sec passes</text></g><g data-step="share" tabindex="0" role="button" aria-label="share reveal_item@1"><title>/runbook/steps/1/steps/2</title><rect x="115" y="750" width="218" height="81" rx="8" fill="#7d6cbd"/><text x="135" y="779" font-weight="700" font-size="18">Share</text><text x="313" y="779" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">reveal_item@1</text><text x="135" y="802" font-size="14">Source: read</text></g><g data-step="pairs" tabindex="0" role="button" aria-label="pairs partition@1"><title>/runbook/steps/2</title><rect x="72" y="899" width="304" height="123" rx="8" fill="#df5583"/><text x="92" y="928" font-weight="700" font-size="18">Pairs</text><text x="356" y="928" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">partition@1</text><text x="92" y="951" font-size="14">“Form pairs in enrollment order.”</text><text x="92" y="972" font-size="14">Policy: policy:roster_chunks@1</text><text x="92" y="993" font-size="14">No timeout</text></g><g data-step="discuss" tabindex="0" role="button" aria-label="discuss collect_group@1"><title>/runbook/steps/3</title><rect x="36" y="1070" width="376" height="144" rx="8" fill="#418cdc"/><text x="56" y="1099" font-weight="700" font-size="18">Discuss</text><text x="392" y="1099" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">collect_group@1</text><text x="56" y="1122" font-size="14">“Discuss the revealed ideas with your</text><text x="56" y="1143" font-size="14">assigned partner.”</text><text x="56" y="1164" font-size="14">Source: pairs</text><text x="56" y="1185" font-size="14">Closes: organizer advances OR 1 min passes</text></g><path d="M 224 258 L 224 287" fill="none" stroke="#418cdc" stroke-width="10" marker-end="url(#arrow-0)"/><text x="240" y="277.5" font-size="14">next</text><path d="M 224 510 L 224 539" fill="none" stroke="#dfc455" stroke-width="10" marker-end="url(#arrow-1)"/><text x="240" y="529.5" font-size="14">next</text><path d="M 224 702 L 224 731" fill="none" stroke="#7dc062" stroke-width="10" marker-end="url(#arrow-2)"/><text x="240" y="721.5" font-size="14">next</text><path d="M 224 851 L 224 880" fill="none" stroke="#eef3fb" stroke-width="10" marker-end="url(#arrow-3)"/><text x="240" y="870.5" font-size="14">next</text><path d="M 224 1022 L 224 1051" fill="none" stroke="#df5583" stroke-width="10" marker-end="url(#arrow-4)"/><text x="240" y="1041.5" font-size="14">next</text></svg>