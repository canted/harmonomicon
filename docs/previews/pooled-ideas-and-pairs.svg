<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1381" viewBox="0 0 600 1381" aria-label="Pooled ideas followed by pair discussion runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Pooled ideas followed by pair discussion</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.14</text><g data-step="slips" tabindex="0" role="button" aria-label="slips pool@1"><title>/runbook/steps/0</title><rect x="40" y="114" width="368" height="165" rx="8" fill="#2c7fd8"/><text x="60" y="143" font-weight="700" font-size="16">slips</text><text x="60" y="166" font-size="14">pool@1</text><text x="60" y="187" font-size="14">“Contribute one idea.”</text><text x="60" y="208" font-size="14">Items per participant: 1</text><text x="60" y="229" font-size="14">Closes: all eligible submissions OR 1 min</text><text x="60" y="250" font-size="14">passes</text></g><g data-step="read_slips" tabindex="0" role="button" aria-label="read_slips for_items@1"><title>/runbook/steps/1</title><rect x="20" y="327" width="408" height="629" rx="8" fill="#eef3fb"/><text x="40" y="356" font-weight="700" font-size="16">read_slips</text><text x="40" y="379" font-size="14">Repeat for each item from slips</text><text x="40" y="400" font-size="14">for_items@1</text></g><g data-step="claim" tabindex="0" role="button" aria-label="claim assign_item@1"><title>/runbook/steps/1/steps/0</title><rect x="56" y="429" width="336" height="144" rx="8" fill="#dbbd42"/><text x="76" y="458" font-weight="700" font-size="16">claim</text><text x="76" y="481" font-size="14">assign_item@1</text><text x="76" y="502" font-size="14">“Claim this slip if it is not yours.”</text><text x="76" y="523" font-size="14">Policy: policy:claim_reader@1</text><text x="76" y="544" font-size="14">Closes: 30 sec passes</text></g><g data-step="read" tabindex="0" role="button" aria-label="read acknowledge@1"><title>/runbook/steps/1/steps/1</title><rect x="40" y="621" width="368" height="165" rx="8" fill="#6eb951"/><text x="60" y="650" font-weight="700" font-size="16">read</text><text x="60" y="673" font-size="14">acknowledge@1</text><text x="60" y="694" font-size="14">“Read the slip, then acknowledge to share</text><text x="60" y="715" font-size="14">its text.”</text><text x="60" y="736" font-size="14">Source: claim</text><text x="60" y="757" font-size="14">Closes: 30 sec passes</text></g><g data-step="share" tabindex="0" role="button" aria-label="share reveal_item@1"><title>/runbook/steps/1/steps/2</title><rect x="134" y="834" width="180" height="102" rx="8" fill="#6652b1"/><text x="154" y="863" font-weight="700" font-size="16">share</text><text x="154" y="886" font-size="14">reveal_item@1</text><text x="154" y="907" font-size="14">Source: read</text></g><g data-step="pairs" tabindex="0" role="button" aria-label="pairs partition@1"><title>/runbook/steps/2</title><rect x="72" y="1004" width="304" height="144" rx="8" fill="#db4275"/><text x="92" y="1033" font-weight="700" font-size="16">pairs</text><text x="92" y="1056" font-size="14">partition@1</text><text x="92" y="1077" font-size="14">“Form pairs in enrollment order.”</text><text x="92" y="1098" font-size="14">Policy: policy:roster_chunks@1</text><text x="92" y="1119" font-size="14">No timeout</text></g><g data-step="discuss" tabindex="0" role="button" aria-label="discuss collect_group@1"><title>/runbook/steps/3</title><rect x="36" y="1196" width="376" height="165" rx="8" fill="#2c7fd8"/><text x="56" y="1225" font-weight="700" font-size="16">discuss</text><text x="56" y="1248" font-size="14">collect_group@1</text><text x="56" y="1269" font-size="14">“Discuss the revealed ideas with your</text><text x="56" y="1290" font-size="14">assigned partner.”</text><text x="56" y="1311" font-size="14">Source: pairs</text><text x="56" y="1332" font-size="14">Closes: organizer advances OR 1 min passes</text></g><path d="M 224 279 L 224 322" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="305.5" font-size="14">next</text><path d="M 224 573 L 224 616" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="599.5" font-size="14">next</text><path d="M 224 786 L 224 829" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="812.5" font-size="14">next</text><path d="M 224 956 L 224 999" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="982.5" font-size="14">next</text><path d="M 224 1148 L 224 1191" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="1174.5" font-size="14">next</text></svg>