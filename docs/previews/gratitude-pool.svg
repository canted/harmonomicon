<svg xmlns="http://www.w3.org/2000/svg" width="448" height="871" viewBox="0 0 448 871" aria-label="Gratefulness Grab Bag runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow-0" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#2c7fd8"/></marker><marker id="arrow-1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#dbbd42"/></marker><marker id="arrow-2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#6eb951"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Gratefulness Grab Bag</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.14</text><g data-step="slips" tabindex="0" role="button" aria-label="slips pool@1"><title>/runbook/steps/0</title><rect x="40" y="114" width="368" height="144" rx="8" fill="#2c7fd8"/><text x="60" y="143" font-weight="700" font-size="18">Slips</text><text x="388" y="143" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">pool@1</text><text x="60" y="166" font-size="14">“Submit two independent gratitude slips.”</text><text x="60" y="187" font-size="14">Items per participant: 2</text><text x="60" y="208" font-size="14">Closes: all eligible submissions OR 1 min</text><text x="60" y="229" font-size="14">passes</text></g><g data-step="read_slips" tabindex="0" role="button" aria-label="read_slips for_items@1"><title>/runbook/steps/1</title><rect x="20" y="306" width="408" height="545" rx="8" fill="#eef3fb"/><text x="40" y="335" font-weight="700" font-size="18">Read Slips</text><text x="408" y="335" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">for_items@1</text><text x="40" y="358" font-size="14">Repeat for each item from slips</text></g><g data-step="claim" tabindex="0" role="button" aria-label="claim assign_item@1"><title>/runbook/steps/1/steps/0</title><rect x="56" y="387" width="336" height="123" rx="8" fill="#dbbd42"/><text x="76" y="416" font-weight="700" font-size="18">Claim</text><text x="372" y="416" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">assign_item@1</text><text x="76" y="439" font-size="14">“Claim this slip if it is not yours.”</text><text x="76" y="460" font-size="14">Policy: policy:claim_reader@1</text><text x="76" y="481" font-size="14">Closes: 30 sec passes</text></g><g data-step="read" tabindex="0" role="button" aria-label="read acknowledge@1"><title>/runbook/steps/1/steps/1</title><rect x="40" y="558" width="368" height="144" rx="8" fill="#6eb951"/><text x="60" y="587" font-weight="700" font-size="18">Read</text><text x="388" y="587" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">acknowledge@1</text><text x="60" y="610" font-size="14">“Read the slip, then acknowledge to share</text><text x="60" y="631" font-size="14">its text.”</text><text x="60" y="652" font-size="14">Source: claim</text><text x="60" y="673" font-size="14">Closes: 30 sec passes</text></g><g data-step="share" tabindex="0" role="button" aria-label="share reveal_item@1"><title>/runbook/steps/1/steps/2</title><rect x="115" y="750" width="218" height="81" rx="8" fill="#6652b1"/><text x="135" y="779" font-weight="700" font-size="18">Share</text><text x="313" y="779" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">reveal_item@1</text><text x="135" y="802" font-size="14">Source: read</text></g><path d="M 224 258 L 224 301" fill="none" stroke="#2c7fd8" stroke-width="10" marker-end="url(#arrow-0)"/><text x="240" y="284.5" font-size="14">next</text><path d="M 224 510 L 224 553" fill="none" stroke="#dbbd42" stroke-width="10" marker-end="url(#arrow-1)"/><text x="240" y="536.5" font-size="14">next</text><path d="M 224 702 L 224 745" fill="none" stroke="#6eb951" stroke-width="10" marker-end="url(#arrow-2)"/><text x="240" y="728.5" font-size="14">next</text></svg>