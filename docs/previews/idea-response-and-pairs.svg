<svg xmlns="http://www.w3.org/2000/svg" width="530" height="1238" viewBox="0 0 530 1238" aria-label="Idea exchange and paired reflection runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow-0" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#418cdc"/></marker><marker id="arrow-1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#4eb1c5"/></marker><marker id="arrow-2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#dfc455"/></marker><marker id="arrow-3" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#7dc062"/></marker><marker id="arrow-4" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#7d6cbd"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Idea exchange and paired reflection</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.24</text><g data-step="sources" tabindex="0" role="button" aria-label="sources pool@1"><title>/runbook/steps/0</title><rect x="44" y="114" width="328" height="123" rx="8" fill="#418cdc"/><text x="64" y="143" font-weight="700" font-size="18">Sources</text><text x="352" y="143" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">pool@1</text><text x="64" y="166" font-size="14">“Describe an image or idea in text.”</text><text x="64" y="187" font-size="14">Items per participant: 1</text><text x="64" y="208" font-size="14">Closes: deadline OR 0.01 sec passes</text></g><g data-step="distribution" tabindex="0" role="button" aria-label="distribution assign_sources@1"><title>/runbook/steps/1</title><rect x="20" y="285" width="376" height="165" rx="8" fill="#4eb1c5"/><text x="40" y="314" font-weight="700" font-size="18">Distribution</text><text x="376" y="314" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">assign_sources@1</text><text x="40" y="337" font-size="14">Source: sources</text><text x="40" y="358" font-size="14">Policy: policy:next_nonself_source@1</text><text x="40" y="379" font-size="14">Recipients: contributors · self excluded</text><text x="40" y="400" font-size="14">Cardinality: one · source reuse: allowed ·</text><text x="40" y="421" font-size="14">unmatched: skip</text></g><g data-step="response" tabindex="0" role="button" aria-label="response respond@1"><title>/runbook/steps/2</title><rect x="20" y="498" width="376" height="207" rx="8" fill="#dfc455"/><text x="40" y="527" font-weight="700" font-size="18">Response</text><text x="376" y="527" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">respond@1</text><text x="40" y="550" font-size="14">“Create a text response to your assigned</text><text x="40" y="571" font-size="14">source.”</text><text x="40" y="592" font-size="14">Source: distribution</text><text x="40" y="613" font-size="14">Independent responses · assigned source ID</text><text x="40" y="634" font-size="14">required</text><text x="40" y="655" font-size="14">Closes: all eligible submissions OR 0.01</text><text x="40" y="676" font-size="14">sec passes</text></g><g data-step="results" tabindex="0" role="button" aria-label="results reveal_responses@1"><title>/runbook/steps/3</title><rect x="36" y="753" width="344" height="123" rx="8" fill="#7dc062"/><text x="56" y="782" font-weight="700" font-size="18">Results</text><text x="360" y="782" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">reveal_responses@1</text><text x="56" y="805" font-size="14">Source: response</text><text x="56" y="826" font-size="14">Publish accepted source-response pairs</text><text x="56" y="847" font-size="14">with attribution</text></g><g data-step="pairs" tabindex="0" role="button" aria-label="pairs partition@1"><title>/runbook/steps/4</title><rect x="68" y="924" width="280" height="123" rx="8" fill="#7d6cbd"/><text x="88" y="953" font-weight="700" font-size="18">Pairs</text><text x="328" y="953" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">partition@1</text><text x="88" y="976" font-size="14">“Form pairs.”</text><text x="88" y="997" font-size="14">Policy: policy:roster_chunks@1</text><text x="88" y="1018" font-size="14">No timeout</text></g><g data-step="reflection" tabindex="0" role="button" aria-label="reflection collect_group@1"><title>/runbook/steps/5</title><rect x="36" y="1095" width="344" height="123" rx="8" fill="#df5583"/><text x="56" y="1124" font-weight="700" font-size="18">Reflection</text><text x="360" y="1124" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">collect_group@1</text><text x="56" y="1147" font-size="14">“Reflect privately with your partner.”</text><text x="56" y="1168" font-size="14">Source: pairs</text><text x="56" y="1189" font-size="14">Closes: deadline OR 0.01 sec passes</text></g><path d="M 208 237 L 208 266" fill="none" stroke="#418cdc" stroke-width="10" marker-end="url(#arrow-0)"/><text x="224" y="256.5" font-size="14">next</text><path d="M 208 450 L 208 479" fill="none" stroke="#4eb1c5" stroke-width="10" marker-end="url(#arrow-1)"/><text x="224" y="469.5" font-size="14">next</text><path d="M 208 705 L 208 734" fill="none" stroke="#dfc455" stroke-width="10" marker-end="url(#arrow-2)"/><text x="224" y="724.5" font-size="14">next</text><path d="M 208 876 L 208 905" fill="none" stroke="#7dc062" stroke-width="10" marker-end="url(#arrow-3)"/><text x="224" y="895.5" font-size="14">next</text><path d="M 208 1047 L 208 1076" fill="none" stroke="#7d6cbd" stroke-width="10" marker-end="url(#arrow-4)"/><text x="224" y="1066.5" font-size="14">next</text></svg>