<svg xmlns="http://www.w3.org/2000/svg" width="544" height="959" viewBox="0 0 544 959" aria-label="Simplified The Art Before the Chorus runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow-0" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#418cdc"/></marker><marker id="arrow-1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#4eb1c5"/></marker><marker id="arrow-2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#dfc455"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Simplified The Art Before the Chorus</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.24</text><g data-step="covers" tabindex="0" role="button" aria-label="covers artifact_pool@1"><title>/runbook/steps/0</title><rect x="20" y="114" width="376" height="165" rx="8" fill="#418cdc"/><text x="40" y="143" font-weight="700" font-size="18">Covers</text><text x="376" y="143" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">artifact_pool@1</text><text x="40" y="166" font-size="14">“Contribute one ready cover image.”</text><text x="40" y="187" font-size="14">Contribution kinds: image</text><text x="40" y="208" font-size="14">Visibility: private</text><text x="40" y="229" font-size="14">Actors/dates: trusted host inputs · closes</text><text x="40" y="250" font-size="14">by date or host control</text></g><g data-step="assignment" tabindex="0" role="button" aria-label="assignment assign_artifacts@1"><title>/runbook/steps/1</title><rect x="20" y="327" width="376" height="165" rx="8" fill="#4eb1c5"/><text x="40" y="356" font-weight="700" font-size="18">Assignment</text><text x="376" y="356" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">assign_artifacts@1</text><text x="40" y="379" font-size="14">Source: covers</text><text x="40" y="400" font-size="14">Policy: policy:seeded_nonself_source@1</text><text x="40" y="421" font-size="14">Recipients: contributors · self excluded</text><text x="40" y="442" font-size="14">Cardinality: one · source reuse: allowed ·</text><text x="40" y="463" font-size="14">unmatched: skip</text></g><g data-step="response" tabindex="0" role="button" aria-label="response artifact_response@1"><title>/runbook/steps/2</title><rect x="20" y="540" width="376" height="228" rx="8" fill="#dfc455"/><text x="40" y="569" font-weight="700" font-size="18">Response</text><text x="376" y="569" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">artifact_response@1</text><text x="40" y="592" font-size="14">“Make a text or audio response to your</text><text x="40" y="613" font-size="14">assigned cover.”</text><text x="40" y="634" font-size="14">Source: assignment</text><text x="40" y="655" font-size="14">Independent responses · assigned source ID</text><text x="40" y="676" font-size="14">required</text><text x="40" y="697" font-size="14">Contribution kinds: text · audio</text><text x="40" y="718" font-size="14">Actors/dates: trusted host inputs · closes</text><text x="40" y="739" font-size="14">by date or host control</text></g><g data-step="results" tabindex="0" role="button" aria-label="results reveal_artifact_responses@1"><title>/runbook/steps/3</title><rect x="33" y="816" width="350" height="123" rx="8" fill="#7dc062"/><text x="53" y="845" font-weight="700" font-size="18">Results</text><text x="363" y="845" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">reveal_artifact_responses@1</text><text x="53" y="868" font-size="14">Source: response</text><text x="53" y="889" font-size="14">Publish accepted source-response pairs</text><text x="53" y="910" font-size="14">with attribution</text></g><path d="M 208 279 L 208 308" fill="none" stroke="#418cdc" stroke-width="10" marker-end="url(#arrow-0)"/><text x="224" y="298.5" font-size="14">next</text><path d="M 208 492 L 208 521" fill="none" stroke="#4eb1c5" stroke-width="10" marker-end="url(#arrow-1)"/><text x="224" y="511.5" font-size="14">next</text><path d="M 208 768 L 208 797" fill="none" stroke="#dfc455" stroke-width="10" marker-end="url(#arrow-2)"/><text x="224" y="787.5" font-size="14">next</text></svg>