="vote vote@3"><title>/runbook/steps/1</title><rect x="20" y="369" width="376" height="186" rx="8" fill="#4eb1c5"/><text x="40" y="398" font-weight="700" font-size="18">Vote</text><text x="376" y="398" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">vote@3</text><text x="40" y="421" font-size="14">“Choose one actual contribution.”</text><text x="40" y="442" font-size="14">Candidates from: pieces</text><text x="40" y="463" font-size="14">Ballot changes: allowed</text><text x="40" y="484" font-size="14">Ballot visibility: private</text><text x="40" y="505" font-size="14">Actors/dates: trusted host inputs · closes</text><text x="40" y="526" font-size="14">by date or host control</text></g><g data-step="counts" tabindex="0" role="button" aria-label="counts tally@4"><title>/runbook/steps/2</title><rect x="118" y="603" width="180" height="81" rx="8" fill="#dfc455"/><text x="138" y="632" font-weight="700" font-size="18">Counts</text><text x="278" y="632" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">tally@4</text><text x="138" y="655" font-size="14">Source: vote</text></g><g data-step="selected" tabindex="0" role="button" aria-label="selected select@3"><title>/runbook/steps/3</title><rect x="80" y="732" width="256" height="144" rx="8" fill="#7dc062"/><text x="100" y="761" font-weight="700" font-size="18">Selected</text><text x="316" y="761" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">select@3</text><text x="100" y="784" font-size="14">Source: counts</text><text x="100" y="805" font-size="14">Policy: policy:most_votes@1</text><text x="100" y="826" font-size="14">Ties: random</text><text x="100" y="847" font-size="14">No votes: random</text></g><g data-step="result" tabindex="0" role="button" aria-label="result present@3"><title>/runbook/steps/4</title><rect x="20" y="924" width="376" height="144" rx="8"