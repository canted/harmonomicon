<svg xmlns="http://www.w3.org/2000/svg" width="530" height="1727" viewBox="0 0 530 1727" aria-label="Impromptu Networking digital rounds runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Impromptu Networking digital rounds</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.14</text><g data-step="welcome" tabindex="0" role="button" aria-label="welcome pause@1"><title>/runbook/steps/0</title><rect x="52" y="114" width="304" height="144" rx="8" fill="#2c7fd8"/><text x="72" y="143" font-weight="700" font-size="16">welcome</text><text x="72" y="166" font-size="14">pause@1</text><text x="72" y="187" font-size="14">“Prepare to introduce yourself to</text><text x="72" y="208" font-size="14">successive partners.”</text><text x="72" y="229" font-size="14">Closes: 30 sec passes</text></g><g data-step="partners1" tabindex="0" role="button" aria-label="partners1 partition@1"><title>/runbook/steps/1</title><rect x="44" y="306" width="320" height="144" rx="8" fill="#3aa8be"/><text x="64" y="335" font-weight="700" font-size="16">partners1</text><text x="64" y="358" font-size="14">partition@1</text><text x="64" y="379" font-size="14">“Assign the groups for this round.”</text><text x="64" y="400" font-size="14">Policy: policy:organizer_groups@1</text><text x="64" y="421" font-size="14">No timeout</text></g><g data-step="round1" tabindex="0" role="button" aria-label="round1 collect_group@1"><title>/runbook/steps/2</title><rect x="32" y="498" width="344" height="165" rx="8" fill="#dbbd42"/><text x="52" y="527" font-weight="700" font-size="16">round1</text><text x="52" y="550" font-size="14">collect_group@1</text><text x="52" y="571" font-size="14">“Introduce yourself and exchange ideas</text><text x="52" y="592" font-size="14">within this assigned group.”</text><text x="52" y="613" font-size="14">Source: partners1</text><text x="52" y="634" font-size="14">Closes: deadline OR 2 min passes</text></g><g data-step="partners2" tabindex="0" role="button" aria-label="partners2 partition@1"><title>/runbook/steps/3</title><rect x="44" y="711" width="320" height="144" rx="8" fill="#6eb951"/><text x="64" y="740" font-weight="700" font-size="16">partners2</text><text x="64" y="763" font-size="14">partition@1</text><text x="64" y="784" font-size="14">“Assign the groups for this round.”</text><text x="64" y="805" font-size="14">Policy: policy:organizer_groups@1</text><text x="64" y="826" font-size="14">No timeout</text></g><g data-step="round2" tabindex="0" role="button" aria-label="round2 collect_group@1"><title>/runbook/steps/4</title><rect x="32" y="903" width="344" height="165" rx="8" fill="#6652b1"/><text x="52" y="932" font-weight="700" font-size="16">round2</text><text x="52" y="955" font-size="14">collect_group@1</text><text x="52" y="976" font-size="14">“Introduce yourself and exchange ideas</text><text x="52" y="997" font-size="14">within this assigned group.”</text><text x="52" y="1018" font-size="14">Source: partners2</text><text x="52" y="1039" font-size="14">Closes: deadline OR 2 min passes</text></g><g data-step="partners3" tabindex="0" role="button" aria-label="partners3 partition@1"><title>/runbook/steps/5</title><rect x="44" y="1116" width="320" height="144" rx="8" fill="#db4275"/><text x="64" y="1145" font-weight="700" font-size="16">partners3</text><text x="64" y="1168" font-size="14">partition@1</text><text x="64" y="1189" font-size="14">“Assign the groups for this round.”</text><text x="64" y="1210" font-size="14">Policy: policy:organizer_groups@1</text><text x="64" y="1231" font-size="14">No timeout</text></g><g data-step="round3" tabindex="0" role="button" aria-label="round3 collect_group@1"><title>/runbook/steps/6</title><rect x="32" y="1308" width="344" height="165" rx="8" fill="#2c7fd8"/><text x="52" y="1337" font-weight="700" font-size="16">round3</text><text x="52" y="1360" font-size="14">collect_group@1</text><text x="52" y="1381" font-size="14">“Introduce yourself and exchange ideas</text><text x="52" y="1402" font-size="14">within this assigned group.”</text><text x="52" y="1423" font-size="14">Source: partners3</text><text x="52" y="1444" font-size="14">Closes: deadline OR 2 min passes</text></g><g data-step="close" tabindex="0" role="button" aria-label="close collect@1"><title>/runbook/steps/7</title><rect x="20" y="1521" width="368" height="186" rx="8" fill="#3aa8be"/><text x="40" y="1550" font-weight="700" font-size="16">close</text><text x="40" y="1573" font-size="14">collect@1</text><text x="40" y="1594" font-size="14">“Share a connection with the full group.”</text><text x="40" y="1615" font-size="14">Actors: participants</text><text x="40" y="1636" font-size="14">response: text · group</text><text x="40" y="1657" font-size="14">Closes: organizer advances</text><text x="40" y="1678" font-size="14">No timeout</text></g><path d="M 204 258 L 204 301" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="284.5" font-size="14">next</text><path d="M 204 450 L 204 493" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="476.5" font-size="14">next</text><path d="M 204 663 L 204 706" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="689.5" font-size="14">next</text><path d="M 204 855 L 204 898" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="881.5" font-size="14">next</text><path d="M 204 1068 L 204 1111" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="1094.5" font-size="14">next</text><path d="M 204 1260 L 204 1303" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="1286.5" font-size="14">next</text><path d="M 204 147