<svg xmlns="http://www.w3.org/2000/svg" width="530" height="1559" viewBox="0 0 530 1559" aria-label="Impromptu Networking digital rounds runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Impromptu Networking digital rounds</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.14</text><g data-step="welcome" tabindex="0" role="button" aria-label="welcome pause@1"><title>/runbook/steps/0</title><rect x="52" y="114" width="304" height="123" rx="8" fill="#2c7fd8"/><text x="72" y="143" font-weight="700" font-size="18">Welcome</text><text x="336" y="143" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">pause@1</text><text x="72" y="166" font-size="14">“Prepare to introduce yourself to</text><text x="72" y="187" font-size="14">successive partners.”</text><text x="72" y="208" font-size="14">Closes: 30 sec passes</text></g><g data-step="partners1" tabindex="0" role="button" aria-label="partners1 partition@1"><title>/runbook/steps/1</title><rect x="44" y="285" width="320" height="123" rx="8" fill="#3aa8be"/><text x="64" y="314" font-weight="700" font-size="18">Partners1</text><text x="344" y="314" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">partition@1</text><text x="64" y="337" font-size="14">“Assign the groups for this round.”</text><text x="64" y="358" font-size="14">Policy: policy:organizer_groups@1</text><text x="64" y="379" font-size="14">No timeout</text></g><g data-step="round1" tabindex="0" role="button" aria-label="round1 collect_group@1"><title>/runbook/steps/2</title><rect x="32" y="456" width="344" height="144" rx="8" fill="#dbbd42"/><text x="52" y="485" font-weight="700" font-size="18">Round1</