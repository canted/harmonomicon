<svg xmlns="http://www.w3.org/2000/svg" width="530" height="1559" viewBox="0 0 530 1559" aria-label="Impromptu Networking digital rounds runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow-0" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#418cdc"/></marker><marker id="arrow-1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#4eb1c5"/></marker><marker id="arrow-2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#dfc455"/></marker><marker id="arrow-3" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#7dc062"/></marker><marker id="arrow-4" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#7d6cbd"/></marker><marker id="arrow-5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#df5583"/></marker><marker id="arrow-6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#418cdc"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Impromptu Networking digital rounds</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.20</text><g data-step="welcome" tabindex="0" role="button" aria-label="welcome pause@1"><title>/runbook/steps/0</title><rect x="52" y="114" width="304" height="123" rx="8" fill="#418cdc"/><text x="72" y="143" font-weight="700" font-size="18">Welcome</text><text x="336" y="143" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">pause@1</text><text x="72" y="166" font-size="14">“Prepare to introduce yourself to</text><text x="72" y="187" font-size="14">successive partners.”</text><text x="72" y="208" font-size="14">Closes: 30 sec passes</text></g><g data-step="partners1" tabindex="0" role="button" aria-label="partners1 partition@1"><title>/runbook/steps/1</title><rect x="44" y="285" width="320" height="123" rx="8" fill="#4eb1c5"/><text x="64" y="314" font-weight="700" font-size="18">Partners1</text><text x="344" y="314" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">partition@1</text><text x="64" y="337" font-size="14">“Assign the groups for this round.”</text><text x="64" y="358" font-size="14">Policy: policy:organizer_groups@1</text><text x="64" y="379" font-size="14">No timeout</text></g><g data-step="round1" tabindex="0" role="button" aria-label="round1 collect_group@1"><title>/runbook/steps/2</title><rect x="32" y="456" width="344" height="144" rx="8" fill="#dfc455"/><text x="52" y="485" font-weight="700" font-size="18">Round1</text><text x="356" y="485" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">collect_group@1</text><text x="52" y="508" font-size="14">“Introduce yourself and exchange ideas</text><text x="52" y="529" font-size="14">within this assigned group.”</text><text x="52" y="550" font-size="14">Source: partners1</text><text x="52" y="571" font-size="14">Closes: deadline OR 2 min passes</text></g><g data-step="partners2" tabindex="0" role="button" aria-label="partners2 partition@1"><title>/runbook/steps/3</title><rect x="44" y="648" width="320" height="123" rx="8" fill="#7dc062"/><text x="64" y="677" font-weight="700" font-size="18">Partners2</text><text x="344" y="677" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">partition@1</text><text x="64" y="700" font-size="14">“Assign the groups for this round.”</text><text x="64" y="721" font-size="14">Policy: policy:organizer_groups@1</text><text x="64" y="742" font-size="14">No timeout</text></g><g data-step="round2" tabindex="0" role="button" aria-label="round2 collect_group@1"><title>/runbook/steps/4</title><rect x="32" y="819" width="344" height="144" rx="8" fill="#7d6cbd"/><text x="52" y="848" font-weight="700" font-size="18">Round2</text><text x="356" y="848" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">collect_group@1</text><text x="52" y="871" font-size="14">“Introduce yourself and exchange ideas</text><text x="52" y="892" font-size="14">within this assigned group.”</text><text x="52" y="913" font-size="14">Source: partners2</text><text x="52" y="934" font-size="14">Closes: deadline OR 2 min passes</text></g><g data-step="partners3" tabindex="0" role="button" aria-label="partners3 partition@1"><title>/runbook/steps/5</title><rect x="44" y="1011" width="320" height="123" rx="8" fill="#df5583"/><text x="64" y="1040" font-weight="700" font-size="18">Partners3</text><text x="344" y="1040" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">partition@1</text><text x="64" y="1063" font-size="14">“Assign the groups for this round.”</text><text x="64" y="1084" font-size="14">Policy: policy:organizer_groups@1</text><text x="64" y="1105" font-size="14">No timeout</text></g><g data-step="round3" tabindex="0" role="button" aria-label="round3 collect_group@1"><title>/runbook/steps/6</title><rect x="32" y="1182" width="344" height="144" rx="8" fill="#418cdc"/><text x="52" y="1211" font-weight="700" font-size="18">Round3</text><text x="356" y="1211" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">collect_group@1</text><text x="52" y="1234" font-size="14">“Introduce yourself and exchange ideas</text><text x="52" y="1255" font-size="14">within this assigned group.”</text><text x="52" y="1276" font-size="14">Source: partners3</text><text x="52" y="1297" font-size="14">Closes: deadline OR 2 min passes</text></g><g data-step="close" tabindex="0" role="button" aria-label="close collect@1"><title>/runbook/steps/7</title><rect x="20" y="1374" width="368" height="165" rx="8" fill="#4eb1c5"/><text x="40" y="1403" font-weight="700" font-size="18">Close</text><text x="368" y="1403" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">collect@1</text><text x="40" y="1426" font-size="14">“Share a connection with the full group.”</text><text x="40" y="1447" font-size="14">Actors: participants</text><text x="40" y="1468" font-size="14">response: text · group</text><text x="40" y="1489" font-size="14">Closes: organizer advances</text><text x="40" y="1510" font-size="14">No timeout</text></g><path d="M 204 237 L 204 266" fill="none" stroke="#418cdc" stroke-width="10" marker-end="url(#arrow-0)"/><text x="220" y="256.5" font-size="14">next</text><path d="M 204 408 L 204 437" fill="none" stroke="#4eb1c5" stroke-width="10" marker-end="url(#arrow-1)"/><text x="220" y="427.5" font-size="14">next</text><path d="M 204 600 L 204 629" fill="none" stroke="#dfc455" stroke-width="10" marker-end="url(#arrow-2)"/><text x="220" y="619.5" font-size="14">next</text><path d="M 204 771 L 204 800" fill="none" stroke="#7dc062" stroke-width="10" marker-end="url(#arrow-3)"/><text x="220" y="790.5" font-size="14">next</text><path d="M 204 963 L 204 992" fill="none" stroke="#7d6cbd" stroke-width="10" marker-end="url(#arrow-4)"/><text x="220" y="982.5" font-size="14">next</text><path d="M 204 1134 L 204 1163" fill="none" stroke="#df5583" stroke-width="10" marker-end="url(#arrow-5)"/><text x="220" y="1153.5" font-size="14">next</text><path d="M 204 1326 L 204 1355" fill="none" stroke="#418cdc" stroke-width="10" marker-end="url(#arrow-6)"/><text x="220" y="1345.5" font-size="14">next</text></svg>