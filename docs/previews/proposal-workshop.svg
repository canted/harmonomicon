<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1853" viewBox="0 0 600 1853" aria-label="Turn a proposal into a shared experiment runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow-0" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#418cdc"/></marker><marker id="arrow-1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#4eb1c5"/></marker><marker id="arrow-2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#dfc455"/></marker><marker id="arrow-3" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#7dc062"/></marker><marker id="arrow-4" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#7d6cbd"/></marker><marker id="arrow-5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#df5583"/></marker><marker id="arrow-6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#418cdc"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Turn a proposal into a shared experiment</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.24</text><g data-step="proposals" tabindex="0" role="button" aria-label="proposals artifact_pool@2"><title>/runbook/steps/0</title><rect x="20" y="114" width="376" height="228" rx="8" fill="#418cdc"/><text x="40" y="143" font-weight="700" font-size="18">Proposals</text><text x="376" y="143" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">artifact_pool@2</text><text x="40" y="166" font-size="14">“Propose one small change that would make</text><text x="40" y="187" font-size="14">our shared workspace more welcoming.”</text><text x="40" y="208" font-size="14">Round: proposing</text><text x="40" y="229" font-size="14">Contribution input: none (null)</text><text x="40" y="250" font-size="14">Contribution kinds: text</text><text x="40" y="271" font-size="14">Visibility: private</text><text x="40" y="292" font-size="14">Actors/dates: trusted host inputs · closes</text><text x="40" y="313" font-size="14">by date or host control</text></g><g data-step="vote" tabindex="0" role="button" aria-label="vote vote@1"><title>/runbook/steps/1</title><rect x="20" y="390" width="376" height="186" rx="8" fill="#4eb1c5"/><text x="40" y="419" font-weight="700" font-size="18">Vote</text><text x="376" y="419" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">vote@1</text><text x="40" y="442" font-size="14">“Choose one proposal to develop together.”</text><text x="40" y="463" font-size="14">Candidates from: proposals</text><text x="40" y="484" font-size="14">Ballot changes: forbidden</text><text x="40" y="505" font-size="14">Ballot visibility: private</text><text x="40" y="526" font-size="14">Actors/dates: trusted host inputs · closes</text><text x="40" y="547" font-size="14">by date or host control</text></g><g data-step="proposal_totals" tabindex="0" role="button" aria-label="proposal_totals tally@2"><title>/runbook/steps/2</title><rect x="73" y="624" width="270" height="81" rx="8" fill="#dfc455"/><text x="93" y="653" font-weight="700" font-size="18">Proposal Totals</text><text x="323" y="653" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">tally@2</text><text x="93" y="676" font-size="14">Source: vote</text></g><g data-step="proposal_choice" tabindex="0" role="button" aria-label="proposal_choice select@1"><title>/runbook/steps/3</title><rect x="69" y="753" width="278" height="123" rx="8" fill="#7dc062"/><text x="89" y="782" font-weight="700" font-size="18">Proposal Choice</text><text x="327" y="782" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">select@1</text><text x="89" y="805" font-size="14">Source: proposal_totals</text><text x="89" y="826" font-size="14">Policy: policy:most_votes@1</text><text x="89" y="847" font-size="14">Ties: unresolved</text></g><g data-step="proposal_result" tabindex="0" role="button" aria-label="proposal_result present@1"><title>/runbook/steps/4</title><rect x="36" y="924" width="344" height="144" rx="8" fill="#7d6cbd"/><text x="56" y="953" font-weight="700" font-size="18">Proposal Result</text><text x="360" y="953" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">present@1</text><text x="56" y="976" font-size="14">“Here is the proposal decision and its</text><text x="56" y="997" font-size="14">vote totals.”</text><text x="56" y="1018" font-size="14">Source: proposal_choice</text><text x="56" y="1039" font-size="14">Audience: group</text></g><g data-step="plans" tabindex="0" role="button" aria-label="plans artifact_pool@2"><title>/runbook/steps/5</title><rect x="20" y="1116" width="376" height="249" rx="8" fill="#df5583"/><text x="40" y="1145" font-weight="700" font-size="18">Plans</text><text x="376" y="1145" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">artifact_pool@2</text><text x="40" y="1168" font-size="14">“Using the selected proposal as your</text><text x="40" y="1189" font-size="14">source, offer one concrete first step.”</text><text x="40" y="1210" font-size="14">Round: planning</text><text x="40" y="1231" font-size="14">Contribution input: step result:</text><text x="40" y="1252" font-size="14">proposal_choice</text><text x="40" y="1273" font-size="14">Contribution kinds: text</text><text x="40" y="1294" font-size="14">Visibility: group</text><text x="40" y="1315" font-size="14">Actors/dates: trusted host inputs · closes</text><text x="40" y="1336" font-size="14">by date or host control</text></g><g data-step="pairs" tabindex="0" role="button" aria-label="pairs partition@1"><title>/runbook/steps/6</title><rect x="20" y="1413" width="376" height="123" rx="8" fill="#418cdc"/><text x="40" y="1442" font-weight="700" font-size="18">Pairs</text><text x="376" y="1442" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">partition@1</text><text x="40" y="1465" font-size="14">“Work with the partner shown by the host.”</text><text x="40" y="1486" font-size="14">Policy: policy:roster_chunks@1</text><text x="40" y="1507" font-size="14">No timeout</text></g><g data-step="exercise" tabindex="0" role="button" aria-label="exercise collect_group@1"><title>/runbook/steps/7</title><rect x="24" y="1584" width="368" height="249" rx="8" fill="#4eb1c5"/><text x="44" y="1613" font-weight="700" font-size="18">Exercise</text><text x="372" y="1613" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">collect_group@1</text><text x="44" y="1636" font-size="14">“If first-step plans are available,</text><text x="44" y="1657" font-size="14">compare them with your partner and</text><text x="44" y="1678" font-size="14">describe one experiment and how you would</text><text x="44" y="1699" font-size="14">notice whether it helped. If planning was</text><text x="44" y="1720" font-size="14">blocked because no proposal was selected,</text><text x="44" y="1741" font-size="14">discuss what is needed before choosing a</text><text x="44" y="1762" font-size="14">proposal and record your next step.”</text><text x="44" y="1783" font-size="14">Source: pairs</text><text x="44" y="1804" font-size="14">Closes: deadline OR 1 min passes</text></g><path d="M 208 342 L 208 371" fill="none" stroke="#418cdc" stroke-width="10" marker-end="url(#arrow-0)"/><text x="224" y="361.5" font-size="14">next</text><path d="M 208 576 L 208 605" fill="none" stroke="#4eb1c5" stroke-width="10" marker-end="url(#arrow-1)"/><text x="224" y="595.5" font-size="14">next</text><path d="M 208 705 L 208 734" fill="none" stroke="#dfc455" stroke-width="10" marker-end="url(#arrow-2)"/><text x="224" y="724.5" font-size="14">next</text><path d="M 208 876 L 208 905" fill="none" stroke="#7dc062" stroke-width="10" marker-end="url(#arrow-3)"/><text x="224" y="895.5" font-size="14">next</text><path d="M 208 1068 L 208 1097" fill="none" stroke="#7d6cbd" stroke-width="10" marker-end="url(#arrow-4)"/><text x="224" y="1087.5" font-size="14">next</text><path d="M 208 1365 L 208 1394" fill="none" stroke="#df5583" stroke-width="10" marker-end="url(#arrow-5)"/><text x="224" y="1384.5" font-size="14">next</text><path d="M 208 1536 L 208 1565" fill="none" stroke="#418cdc" stroke-width="10" marker-end="url(#arrow-6)"/><text x="224" y="1555.5" font-size="14">next</text></svg>