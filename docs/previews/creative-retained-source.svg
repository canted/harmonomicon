licy: policy:most_votes@1</text><text x="100" y="889" font-size="14">Ties: random</text><text x="100" y="910" font-size="14">No votes: retain_input</text></g><g data-step="result" tabindex="0" role="button" aria-label="result present@2"><title>/runbook/steps/4</title><rect x="40" y="987" width="336" height="144" rx="8" fill="#7d6cbd"/><text x="60" y="1016" font-weight="700" font-size="18">Result</text><text x="356" y="1016" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">present@2</text><text x="60" y="1039" font-size="14">“Here is the outcome and the selected</text><text x="60" y="1060" font-size="14">starting material, if any.”</text><text x="60" y="1081" font-size="14">Source: selected</text><text x="60" y="1102" font-size="14">Audience: group</text></g><path d="M 208 363 L 208 392" fill="none" stroke="#418cdc" stroke-width="10" marker-end="url(#arrow-0)"/><text x="224" y="382.5" font-size="14">next</text><path d="M 208 618 L 208 647" fill="none" stroke="#4eb1c5" stroke-width="10" marker-end="url(#arrow-1)"/><text x="224" y="637.5" font-size="14">next</text><path d="M 208 747 L 208 776" fill="none" stroke="#dfc455" stroke-width="10" marker-end="url(#arrow-2)"/><text x="224" y="766.5" font-size="14">next</text><path d="M 208 939 L 208 968" fill="none" stroke="#7dc062" stroke-width="10" marker-end="url(#arrow-3)"/><text x="224" y="958.5" font-size="14">next</text></svg>