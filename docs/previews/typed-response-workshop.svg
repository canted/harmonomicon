<svg xmlns="http://www.w3.org/2000/svg" width="698" height="1406" viewBox="0 0 698 1406" aria-label="Turn shared materials into practical next steps runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow-0" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#418cdc"/></marker><marker id="arrow-1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#4eb1c5"/></marker><marker id="arrow-2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#dfc455"/></marker><marker id="arrow-3" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#7dc062"/></marker><marker id="arrow-4" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#7d6cbd"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Turn shared materials into practical next steps</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.24</text><g data-step="pieces" tabindex="0" role="button" aria-label="pieces pool@2"><title>/runbook/steps/0</title><rect x="20" y="114" width="376" height="207" rx="8" fill="#418cdc"/><text x="40" y="143" font-weight="700" font-size="18">Pieces</text><text x="376" y="143" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">pool@2</text><text x="40" y="166" font-size="14">“Submit up to 2 independent contributions</text><text x="40" y="187" font-size="14">across the accepted kinds.”</text><text x="40" y="208" font-size="14">Items per participant: 2</text><text x="40" y="229" font-size="14">Contribution kinds: text · image · audio</text><text x="40" y="250" font-size="14">Visibility: private</text><text x="40" y="271" font-size="14">Actors/dates: trusted host inputs · closes</text><text x="40" y="292" font-size="14">by date or host control</text></g><g data-step="sources" tabindex="0" role="button" aria-label="sources assign_artifacts@2"><title>/runbook/steps/1</title><rect x="20" y="369" width="376" height="165" rx="8" fill="#4eb1c5"/><text x="40" y="398" font-weight="700" font-size="18">Sources</text><text x="376" y="398" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">assign_artifacts@2</text><text x="40" y="421" font-size="14">Source: pieces</text><text x="40" y="442" font-size="14">Policy: policy:next_nonself_item@1</text><text x="40" y="463" font-size="14">Recipients: effective · self excluded</text><text x="40" y="484" font-size="14">Cardinality: one · source reuse: allowed ·</text><text x="40" y="505" font-size="14">unmatched: skip</text></g><g data-step="response" tabindex="0" role="button" aria-label="response artifact_response@2"><title>/runbook/steps/2</title><rect x="20" y="582" width="376" height="228" rx="8" fill="#dfc455"/><text x="40" y="611" font-weight="700" font-size="18">Response</text><text x="376" y="611" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">artifact_response@2</text><text x="40" y="634" font-size="14">“Describe a possible use of your assigned</text><text x="40" y="655" font-size="14">contribution in text or audio.”</text><text x="40" y="676" font-size="14">Source: sources</text><text x="40" y="697" font-size="14">Independent responses · assigned source ID</text><text x="40" y="718" font-size="14">required</text><text x="40" y="739" font-size="14">Contribution kinds: text · audio</text><text x="40" y="760" font-size="14">Actors/dates: trusted host inputs · closes</text><text x="40" y="781" font-size="14">by date or host control</text></g><g data-step="exchange" tabindex="0" role="button" aria-label="exchange reveal_artifact_responses@2"><title>/runbook/steps/3</title><rect x="28" y="858" width="360" height="123" rx="8" fill="#7dc062"/><text x="48" y="887" font-weight="700" font-size="18">Exchange</text><text x="368" y="887" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">reveal_artifact_responses@2</text><text x="48" y="910" font-size="14">Source: response</text><text x="48" y="931" font-size="14">Publish accepted source-response pairs</text><text x="48" y="952" font-size="14">with attribution</text></g><g data-step="pairs" tabindex="0" role="button" aria-label="pairs partition@1"><title>/runbook/steps/4</title><rect x="24" y="1029" width="368" height="123" rx="8" fill="#7d6cbd"/><text x="44" y="1058" font-weight="700" font-size="18">Pairs</text><text x="372" y="1058" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">partition@1</text><text x="44" y="1081" font-size="14">“Work in pairs on a practical next step.”</text><text x="44" y="1102" font-size="14">Policy: policy:roster_chunks@1</text><text x="44" y="1123" font-size="14">No timeout</text></g><g data-step="discussion" tabindex="0" role="button" aria-label="discussion collect_group@1"><title>/runbook/steps/5</title><rect x="20" y="1200" width="376" height="186" rx="8" fill="#df5583"/><text x="40" y="1229" font-weight="700" font-size="18">Discussion</text><text x="376" y="1229" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">collect_group@1</text><text x="40" y="1252" font-size="14">“Discuss one next step using the shared</text><text x="40" y="1273" font-size="14">exchanges, or note what is still needed if</text><text x="40" y="1294" font-size="14">none was shared.”</text><text x="40" y="1315" font-size="14">Source: pairs</text><text x="40" y="1336" font-size="14">Closes: all eligible submissions OR 1 min</text><text x="40" 