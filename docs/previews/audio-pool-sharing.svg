<svg xmlns="http://www.w3.org/2000/svg" width="456" height="976" viewBox="0 0 456 976" aria-label="Listen and share recordings runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow-0" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#418cdc"/></marker><marker id="arrow-1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#dfc455"/></marker><marker id="arrow-2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#7dc062"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Listen and share recordings</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.24</text><g data-step="pieces" tabindex="0" role="button" aria-label="pieces pool@2"><title>/runbook/steps/0</title><rect x="40" y="114" width="376" height="186" rx="8" fill="#418cdc"/><text x="60" y="143" font-weight="700" font-size="18">Pieces</text><text x="396" y="143" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">pool@2</text><text x="60" y="166" font-size="14">“Offer up to two ready audio recordings.”</text><text x="60" y="187" font-size="14">Items per participant: 2</text><text x="60" y="208" font-size="14">Contribution kinds: audio</text><text x="60" y="229" font-size="14">Visibility: private</text><text x="60" y="250" font-size="14">Actors/dates: trusted host inputs · closes</text><text x="60" y="271" font-size="14">by date or host control</text></g><g data-step="sharing" tabindex="0" role="button" aria-label="sharing for_items@2"><title>/runbook/steps/1</title><rect x="20" y="348" width="416" height="608" rx="8" fill="#eef3fb"/><text x="40" y="377" font-weight="700" font-size="18">Sharing</text><text x="416" y="377" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">for_items@2</text><text x="40" y="400" font-size="14">Repeat for each item from pieces ·</text><text x="40" y="421" font-size="14">policy:pool_order@1</text></g><g data-step="claim" tabindex="0" role="button" aria-label="claim assign_item@2"><title>/runbook/steps/1/steps/0</title><rect x="40" y="450" width="376" height="144" rx="8" fill="#dfc455"/><text x="60" y="479" font-weight="700" font-size="18">Claim</text><text x="396" y="479" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">assign_item@2</text><text x="60" y="502" font-size="14">“Claim this contribution if it is not your</text><text x="60" y="523" font-size="14">own.”</text><text x="60" y="544" font-size="14">Policy: policy:claim_reader@1</text><text x="60" y="565" font-size="14">Closes: 30 sec passes</text></g><g data-step="read" tabindex="0" role="button" aria-label="read acknowledge@2"><title>/runbook/steps/1/steps/1</title><rect x="44" y="642" width="368" height="165" rx="8" fill="#7dc062"/><text x="64" y="671" font-weight="700" font-size="18">Read</text><text x="392" y="671" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">acknowledge@2</text><text x="64" y="694" font-size="14">“Read or play your assigned contribution,</text><text x="64" y="715" font-size="14">then acknowledge to share it with</text><text x="64" y="736" font-size="14">attribution.”</text><text x="64" y="757" font-size="14">Source: claim</text><text x="64" y="778" font-size="14">Closes: 30 sec passes</text></g><g data-step="share" tabindex="0" role="button" aria-label="share reveal_item@2"><title>/runbook/steps/1/steps/2</title><rect x="119" y="855" width="218" height="81" rx="8" fill="#7d6cbd"/><text x="139" y="884" font-weight="700" font-size="18">Share</text><text x="317" y="884" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">reveal_item@2</text><text x="139" y="907" font-size="14">Source: read</text></g><path d="M 228 300 L 228 329" fill="none" stroke="#418cdc" stroke-width="10" marker-end="url(#arrow-0)"/><text x="244" y="319.5" font-size="14">next</text><path d="M 228 594 L 228 623" fill="none" stroke="#dfc455" stroke-width="10" marker-end="url(#arrow-1)"/><text x="244" y="613.5" font-size="14">next</text><path d="M 228 807 L 228 836" fill="none" stroke="#7dc062" stroke-width="10" marker-end="url(#arrow-2)"/><text x="244" y="826.5" font-size="14">next</text></svg>