<svg xmlns="http://www.w3.org/2000/svg" width="440" height="784" viewBox="0 0 440 784" aria-label="Two Truths and a Tall Tale runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow-0" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#4eb1c5"/></marker><marker id="arrow-1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#dfc455"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Two Truths and a Tall Tale</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.15</text><g data-step="turns" tabindex="0" role="button" aria-label="turns for_each@1"><title>/runbook/steps/0</title><rect x="20" y="114" width="400" height="650" rx="8" fill="#eef3fb"/><text x="40" y="143" font-weight="700" font-size="18">Turns</text><text x="400" y="143" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">for_each@1</text><text x="40" y="166" font-size="14">Repeat for each participant · roster order</text></g><g data-step="publish" tabindex="0" role="button" aria-label="publish collect@1"><title>/runbook/steps/0/steps/0</title><rect x="40" y="195" width="360" height="207" rx="8" fill="#4eb1c5"/><text x="60" y="224" font-weight="700" font-size="18">Publish</text><text x="380" y="224" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">collect@1</text><text x="60" y="247" font-size="14">“Publish three statements and select the</text><text x="60" y="268" font-size="14">invented statement.”</text><text x="60" y="289" font-size="14">Actors: current participant</text><text x="60" y="310" font-size="14">items: text_list (3 items) · group</text><text x="60" y="331" font-size="14">answer: index → items · private</text><text x="60" y="352" font-size="14">Closes: all eligible submissions</text><text x="60" y="373" font-size="14">No timeout</text></g><g data-step="guess" tabindex="0" role="button" aria-label="guess collect@1"><title>/runbook/steps/0/steps/1</title><rect x="48" y="450" width="344" height="165" rx="8" fill="#dfc455"/><text x="68" y="479" font-weight="700" font-size="18">Guess</text><text x="372" y="479" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">collect@1</text><text x="68" y="502" font-size="14">“Guess the invented statement.”</text><text x="68" y="523" font-size="14">Actors: other participants</text><text x="68" y="544" font-size="14">guess: index → publish.items · private</text><text x="68" y="565" font-size="14">Closes: current participant advances</text><text x="68" y="586" font-size="14">No timeout</text></g><g data-step="reveal" tabindex="0" role="button" aria-label="reveal reveal@1"><title>/runbook/steps/0/steps/2</title><rect x="108" y="663" width="224" height="81" rx="8" fill="#7dc062"/><text x="128" y="692" font-weight="700" font-size="18">Reveal</text><text x="312" y="692" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">reveal@1</text><text x="128" y="715" font-size="14">Sources: publish, guess</text></g><path d="M 220 402 L 220 431" fill="none" stroke="#4eb1c5" stroke-width="10" marker-end="url(#arrow-0)"/><text x="236" y="421.5" font-size="14">next</text><path d="M 220 615 L 220 644" fill="none" stroke="#dfc455" stroke-width="10" marker-end="url(#arrow-1)"/><text x="236" y="634.5" font-size="14">next</text></svg>