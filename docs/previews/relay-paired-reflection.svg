<svg xmlns="http://www.w3.org/2000/svg" width="642" height="788" viewBox="0 0 642 788" aria-label="Creative contribution and paired reflection runbook" style="font-family:Arial,sans-serif;fill:black"><defs><marker id="arrow-0" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#418cdc"/></marker><marker id="arrow-1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#4eb1c5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="32" font-size="24" font-weight="700">Creative contribution and paired reflection</text><text x="20" y="59" font-size="14">harmonomicon.activity-package/0.24</text><g data-step="piece" tabindex="0" role="button" aria-label="piece first_valid@1"><title>/runbook/steps/0</title><rect x="20" y="114" width="376" height="207" rx="8" fill="#418cdc"/><text x="40" y="143" font-weight="700" font-size="18">Piece</text><text x="376" y="143" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">first_valid@1</text><text x="40" y="166" font-size="14">“Add a text or image to the shared story.”</text><text x="40" y="187" font-size="14">Policy: policy:rolling_pair@1</text><text x="40" y="208" font-size="14">Contribution input: none (null)</text><text x="40" y="229" font-size="14">Invitation queue input: none (null)</text><text x="40" y="250" font-size="14">Invitation window: 86400000 ms</text><text x="40" y="271" font-size="14">Failed-pass retry delay: 86400000 ms</text><text x="40" y="292" font-size="14">Contribution kinds: text · image</text></g><g data-step="pairs" tabindex="0" role="button" aria-label="pairs partition@1"><title>/runbook/steps/1</title><rect x="44" y="369" width="328" height="144" rx="8" fill="#4eb1c5"/><text x="64" y="398" font-weight="700" font-size="18">Pairs</text><text x="352" y="398" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">partition@1</text><text x="64" y="421" font-size="14">“Form reflection pairs in enrollment</text><text x="64" y="442" font-size="14">order.”</text><text x="64" y="463" font-size="14">Policy: policy:roster_chunks@1</text><text x="64" y="484" font-size="14">No timeout</text></g><g data-step="reflect" tabindex="0" role="button" aria-label="reflect collect_group@1"><title>/runbook/steps/2</title><rect x="20" y="561" width="376" height="207" rx="8" fill="#dfc455"/><text x="40" y="590" font-weight="700" font-size="18">Reflect</text><text x="376" y="590" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">collect_group@1</text><text x="40" y="613" font-size="14">“Reflect with your partner on the accepted</text><text x="40" y="634" font-size="14">piece. If nobody contributed, discuss an</text><text x="40" y="655" font-size="14">idea for starting the story. Your note is</text><text x="40" y="676" font-size="14">visible only within your pair.”</text><text x="40" y="697" font-size="14">Source: pairs</text><text x="40" y="718" font-size="14">Closes: organizer advances OR 1440 min</text><text x="40" y="739" font-size="14">passes</text></g><path d="M 208 321 L 208 350" fill="none" stroke="#418cdc" stroke-width="10" marker-end="url(#arrow-0)"/><text x="224" y="340.5" font-size="14">next</text><path d="M 208 513 L 208 542" fill="none" stroke="#4eb1c5" stroke-width="10" marker-end="url(#arrow-1)"/><text x="224" y="532.5" font-size="14">next</text></svg>