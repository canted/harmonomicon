ono-Regular, Menlo, Consolas, monospace" font-size="13">collect_group@1</text><text x="72" y="487" font-size="14">“Reflect privately.”</text><text x="72" y="508" font-size="14">Source: solo_rooms</text><text x="72" y="529" font-size="14">Closes: deadline OR 1 min passes</text></g><g data-step="pairs_rooms" tabindex="0" role="button" aria-label="pairs_rooms partition@1"><title>/runbook/steps/3</title><rect x="40" y="606" width="320" height="123" rx="8" fill="#6eb951"/><text x="60" y="635" font-weight="700" font-size="18">Pairs Rooms</text><text x="340" y="635" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">partition@1</text><text x="60" y="658" font-size="14">“Assign the groups for this round.”</text><text x="60" y="679" font-size="14">Policy: policy:roster_chunks@1</text><text x="60" y="700" font-size="14">No timeout</text></g><g data-step="pairs" tabindex="0" role="button" aria-label="pairs collect_group@1"><title>/runbook/steps/4</title><rect x="44" y="777" width="312" height="123" rx="8" fill="#6652b1"/><text x="64" y="806" font-weight="700" font-size="18">Pairs</text><text x="336" y="806" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">collect_group@1</text><text x="64" y="829" font-size="14">“Compare ideas with your partner.”</text><text x="64" y="850" font-size="14">Source: pairs_rooms</text><text x="64" y="871" font-size="14">Closes: deadline OR 2 min passes</text></g><g data-step="quartets_rooms" tabindex="0" role="button" aria-label="quartets_rooms partition@1"><title>/runbook/steps/5</title><rect x="40" y="948" width="320" height="123" rx="8" fill="#db4275"/><text x="60" y="977" font-weight="700" font-size="18">Quartets Rooms</text><text x="340" y="977" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">partition@1</text><text x="60" y="1000" font-size="14">“Assign the groups for this round.”<